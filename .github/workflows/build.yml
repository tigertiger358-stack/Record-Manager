
name: Build Record Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/recordmanager/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RecordManager"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.recordmanager.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.recordmanager.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Record Manager"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/recordmanager/app/MainActivity.java <<'EOF'
          package com.recordmanager.app;

          import android.app.*;
          import android.os.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.content.*;
          import android.view.*;
          import android.widget.*;
          import android.text.*;
          import org.json.*;

          public class MainActivity extends Activity {
              LinearLayout root, body;
              EditText search;
              int blue = Color.rgb(24,65,110);
              int pale = Color.rgb(242,247,253);
              android.content.SharedPreferences prefs;

              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("records", MODE_PRIVATE);
                  home();
              }

              GradientDrawable shape(int color, int radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(radius);
                  return d;
              }

              TextView text(String s, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setPadding(12,10,12,10);
                  return t;
              }

              void setup(String title) {
                  root = new LinearLayout(this);
                  root.setOrientation(1);
                  root.setBackgroundColor(pale);
                  setContentView(root);

                  TextView bar = text("  RECORD MANAGER     |     " + title, 20, Color.WHITE);
                  bar.setTypeface(null, Typeface.BOLD);
                  bar.setBackgroundColor(blue);
                  root.addView(bar, new LinearLayout.LayoutParams(-1,62));

                  ScrollView scroll = new ScrollView(this);
                  body = new LinearLayout(this);
                  body.setOrientation(1);
                  body.setPadding(16,14,16,20);
                  scroll.addView(body);
                  root.addView(scroll);
              }

              void heading(String s) {
                  TextView t = text(s,25,blue);
                  t.setTypeface(null,Typeface.BOLD);
                  body.addView(t);
              }
void button(String s, Runnable action) {
    Button b = new Button(this);
    b.setText(s);
    b.setTextColor(Color.WHITE);
    b.setTextSize(17);
    b.setAllCaps(false);
    b.setGravity(Gravity.CENTER);
    b.setPadding(12, 8, 12, 8);
    b.setMinHeight(58);
    b.setBackground(shape(blue, 18));
    b.setBackgroundTintList(null);
    b.setOnClickListener(v -> action.run());

    LinearLayout.LayoutParams p =
        new LinearLayout.LayoutParams(-1, 60);
    p.setMargins(0, 8, 0, 8);
    body.addView(b, p);
}
        EditText field(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setTextSize(16);
                  e.setSingleLine(false);
                  e.setPadding(14,10,14,10);
                  e.setBackground(shape(Color.WHITE,12));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                  p.setMargins(0,6,0,6);
                  body.addView(e,p);
                  return e;
              }

              void home() {
                  setup("HOME");
                  heading("Welcome!");
                  body.addView(text("Your personal records, organized and secure.",17,Color.DKGRAY));
                  button("👤  My Profile", () -> profile());
                  button("＋  New Record", () -> newRecord());
                  button("▤  Old Records", () -> oldRecords(""));
                  button("⌕  CNIC Search", () -> oldRecords("cnic"));
                  button("☎  Mobile Search", () -> oldRecords("mobile"));
                  button("◎  Nearby Social", () -> message("Nearby Social", "This feature is not available yet."));
                  button("Support", () -> message("Support", "Support service will be added in a future update."));
                  button("⚙  Settings", () -> message("Settings", "More settings will be added later."));
                  body.addView(text("Version 1.1  •  Records are stored on this phone",13,Color.GRAY));
              }

              void newRecord() {
                  setup("NEW RECORD");
                  heading("Add a Person");
                  EditText name = field("Full Name *");
                  EditText cnic = field("CNIC Number");
                  EditText mobile = field("Mobile Number");
                  EditText dob = field("Date of Birth");
                  EditText address = field("Address");
                  EditText marital = field("Marital Status");
                  EditText notes = field("Notes");
                  button("SAVE RECORD", () -> {
                      String n = name.getText().toString().trim();
                      if(n.isEmpty()) {
                          name.setError("Name is required");
                          return;
                      }
                      try {
                          JSONArray a = new JSONArray(prefs.getString("data","[]"));
                          JSONObject o = new JSONObject();
                          o.put("name",n);
                          o.put("cnic",cnic.getText().toString());
                          o.put("mobile",mobile.getText().toString());
                          o.put("dob",dob.getText().toString());
                          o.put("address",address.getText().toString());
                          o.put("marital",marital.getText().toString());
                          o.put("notes",notes.getText().toString());
                          a.put(o);
                          prefs.edit().putString("data",a.toString()).apply();
                          new AlertDialog.Builder(this)
                              .setMessage("Record saved on this phone.")
                              .setPositiveButton("OK",(d,w)->oldRecords(""))
                              .show();
                      } catch(Exception ex) {
                          message("Error","Could not save this record.");
                      }
                  });
                  button("BACK TO HOME", () -> home());
              }

              void oldRecords(String filter) {
                  setup("OLD RECORDS");
                  heading("Saved Records");
                  search = field("Search name, CNIC or mobile");
                  LinearLayout results = new LinearLayout(this);
                  results.setOrientation(1);
                  body.addView(results);

                  Runnable show = () -> {
                      results.removeAllViews();
                      try {
                          JSONArray a = new JSONArray(prefs.getString("data","[]"));
                          String q = search.getText().toString().toLowerCase();
                          for(int i=a.length()-1;i>=0;i--) {
                              JSONObject o = a.getJSONObject(i);
                              String all = o.optString("name")+" "+o.optString("cnic")+" "+o.optString("mobile");
                              if(!all.toLowerCase().contains(q)) continue;
                              TextView card = text(
                                  o.optString("name")+
                                  "\nCNIC: "+o.optString("cnic")+
                                  "\nMobile: "+o.optString("mobile")+
                                  "\nDOB: "+o.optString("dob")+
                                  "\nAddress: "+o.optString("address")+
                                  "\nMarital Status: "+o.optString("marital")+
                                  "\nNotes: "+o.optString("notes"),16,blue);
                              card.setBackground(shape(Color.WHITE,14));
                              LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                              p.setMargins(0,6,0,10);
                              results.addView(card,p);
                              final int index=i;
                              Button del = new Button(this);
                              del.setText("Delete this record");
                              del.setOnClickListener(v -> new AlertDialog.Builder(this)
                                  .setMessage("Delete this record?")
                                  .setNegativeButton("Cancel",null)
                                  .setPositiveButton("Delete",(d,w)->{
                                      try {
                                          JSONArray old = new JSONArray(prefs.getString("data","[]"));
                                          JSONArray fresh = new JSONArray();
                                          for(int j=0;j<old.length();j++) if(j!=index) fresh.put(old.get(j));
                                          prefs.edit().putString("data",fresh.toString()).apply();
                                          oldRecords("");
                                      } catch(Exception ex) {}
                                  }).show());
                              results.addView(del);
                          }
                          if(results.getChildCount()==0)
                              results.addView(text("No matching records found.",16,Color.GRAY));
                      } catch(Exception ex) {}
                  };
                  search.addTextChangedListener(new TextWatcher() {
                      public void beforeTextChanged(CharSequence s,int st,int c,int a) {}
                      public void onTextChanged(CharSequence s,int st,int before,int count) { show.run(); }
                      public void afterTextChanged(Editable e) {}
                  });
                  show.run();
                  button("＋  ADD NEW RECORD", () -> newRecord());
                  button("BACK TO HOME", () -> home());
              }

              void profile() {
                  setup("MY PROFILE");
                  heading("My Profile");
                  EditText name = field("Your Name");
                  EditText mobile = field("Your Mobile Number");
                  name.setText(prefs.getString("profile_name",""));
                  mobile.setText(prefs.getString("profile_mobile",""));
                  button("SAVE PROFILE", () -> {
                      prefs.edit()
                          .putString("profile_name",name.getText().toString())
                          .putString("profile_mobile",mobile.getText().toString())
                          .apply();
                      message("Saved","Your profile has been saved on this phone.");
                  });
                  button("BACK TO HOME", () -> home());
              }

              void message(String title,String msg) {
                  new AlertDialog.Builder(this)
                      .setTitle(title).setMessage(msg)
                      .setPositiveButton("OK",null).show();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Record-Manager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
